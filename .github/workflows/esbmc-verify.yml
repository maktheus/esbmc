name: ESBMC Continuous Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pibic/requirements.txt
        
    # O binario 6.8.0 ja vem no repositorio, entao nao ha download nem
    # versao a divergir. `export PATH` num step NAO persiste para o proximo
    # no GitHub Actions -- por isso o caminho vai por $ESBMC_BIN, que o
    # esbmc_caller resolve.
    - name: Localizar o binario do ESBMC
      run: |
        echo "ESBMC_BIN=$(pwd)/pibic/QNNVerifier/esbmc-6.8.0/esbmc" >> $GITHUB_ENV
        chmod +x pibic/QNNVerifier/esbmc-6.8.0/esbmc
        pibic/QNNVerifier/esbmc-6.8.0/esbmc --version
        
    - name: Suite de verificacao formal
      run: |
        cd pibic
        pytest tests/ -v --durations=10
